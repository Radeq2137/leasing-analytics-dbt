[project]
name = "leasing-analytics-dbt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.111",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "faker>=40.43.0",
]

[tool.pytest.ini_options]
# Lets tests import the `generator` package from the project root.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
