version: 2

sources:
  - name: raw
    description: >
      Raw CSV files written by the generator to S3 (one file per table per day,
      Hive partition dt=YYYY-MM-DD). See docs/02-data-contract.md.
    meta:
      # {name} is replaced by the table name below. Every column is read as text
      # (all_varchar): types are cast in staging, so one dirty value never breaks the read.
      # The bucket name comes from the S3_BUCKET environment variable (default = our bucket).
      external_location: >-
        read_csv('s3://{{ env_var("S3_BUCKET", "leasing-dbt-radeq-2026") }}/raw/{name}/*/*.csv',
        header = true, all_varchar = true, hive_partitioning = true)
    tables:
      - name: contracts
        description: One row per lease contract signed on business day dt (flat extract, dirty on purpose).
